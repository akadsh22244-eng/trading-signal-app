<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forex Signal App</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08111f;
  color:white;
}

.header{
  background:#111d31;
  padding:25px;
  text-align:center;
}

.card{
  background:#14233b;
  margin:18px;
  padding:20px;
  border-radius:18px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  font-size:17px;
}

select, input, button{
  width:100%;
  padding:16px;
  box-sizing:border-box;
  border-radius:12px;
  border:none;
  font-size:16px;
}

input, select{
  background:white;
  color:#111;
}

button{
  margin-top:20px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

.result{
  text-align:center;
  padding:30px 10px;
  border-radius:15px;
  background:#101b2d;
}

.signal{
  font-size:45px;
  font-weight:bold;
  margin:15px;
}

.buy{color:#22c55e;}
.sell{color:#ef4444;}
.wait{color:#facc15;}

.price{
  font-size:25px;
  font-weight:bold;
  color:#60a5fa;
}
</style>
</head>

<body>

<div class="header">
<h1>📈 Forex Signal App</h1>
<p>Price + EMA + RSI Signal</p>
</div>

<div class="card">

<label>API Key</label>

<input
id="apikey"
placeholder="Paste your Twelve Data API Key"
type="password">

<label>Currency Pair</label>

<select id="pair">

<option value="EUR/USD">EUR/USD</option>
<option value="GBP/USD">GBP/USD</option>
<option value="USD/JPY">USD/JPY</option>
<option value="AUD/USD">AUD/USD</option>
<option value="USD/CAD">USD/CAD</option>
<option value="USD/CHF">USD/CHF</option>
<option value="NZD/USD">NZD/USD</option>
<option value="EUR/JPY">EUR/JPY</option>
<option value="GBP/JPY">GBP/JPY</option>

</select>

<label>Timeframe</label>

<select id="timeframe">

<option value="1min">1 Minute</option>
<option value="5min">5 Minutes</option>

</select>

<button onclick="getSignal()">
ANALYZE PRICE
</button>

</div>


<div class="card">

<div class="result">

<h2>Current Price</h2>

<div id="price" class="price">
--
</div>

<h2>Signal</h2>

<div id="signal" class="signal wait">
WAIT
</div>

<p id="details">
Enter API Key and press Analyze Price
</p>

</div>

</div>


<script>

function calculateEMA(prices, period){

  const k = 2 / (period + 1);

  let ema = prices[0];

  for(let i = 1; i < prices.length; i++){

    ema =
      prices[i] * k +
      ema * (1 - k);

  }

  return ema;

}


function calculateRSI(prices, period = 14){

  let gains = 0;
  let losses = 0;

  for(
    let i = prices.length - period;
    i < prices.length;
    i++
  ){

    const change =
      prices[i] - prices[i - 1];

    if(change > 0){
      gains += change;
    }
    else{
      losses += Math.abs(change);
    }

  }

  const avgGain = gains / period;
  const avgLoss = losses / period;

  if(avgLoss === 0){
    return 100;
  }

  const rs =
    avgGain / avgLoss;

  return 100 - (100 / (1 + rs));

}


async function getSignal(){

  const apiKey =
    document.getElementById("apikey").value.trim();

  const pair =
    document.getElementById("pair").value;

  const timeframe =
    document.getElementById("timeframe").value;


  if(!apiKey){

    alert("Please enter your API Key");

    return;

  }


  document.getElementById("details").innerText =
    "Loading market data...";


  try{

    const url =
      "https://api.twelvedata.com/time_series" +
      "?symbol=" +
      encodeURIComponent(pair) +
      "&interval=" +
      timeframe +
      "&outputsize=60" +
      "&apikey=" +
      encodeURIComponent(apiKey);


    const response =
      await fetch(url);

    const data =
      await response.json();


    if(
      data.status === "error" ||
      !data.values
    ){

      throw new Error(
        data.message ||
        "Could not load price"
      );

    }


    const candles =
      data.values.reverse();


    const prices =
      candles.map(
        candle =>
        parseFloat(candle.close)
      );


    const currentPrice =
      prices[prices.length - 1];


    document.getElementById("price").innerText =
      currentPrice;


    const ema9 =
      calculateEMA(
        prices.slice(-30),
        9
      );


    const ema21 =
      calculateEMA(
        prices.slice(-40),
        21
      );


    const rsi =
      calculateRSI(
        prices,
        14
      );


    let result = "WAIT";


    if(
      ema9 > ema21 &&
      currentPrice > ema9 &&
      rsi > 50 &&
      rsi < 70
    ){

      result = "BUY";

    }

    else if(
      ema9 < ema21 &&
      currentPrice < ema9 &&
      rsi < 50 &&
      rsi > 30
    ){

      result = "SELL";

    }


    const signal =
      document.getElementById("signal");


    signal.innerText =
      result;


    signal.className =
      "signal";


    if(result === "BUY"){

      signal.classList.add("buy");

    }

    else if(result === "SELL"){

      signal.classList.add("sell");

    }

    else{

      signal.classList.add("wait");

    }


    document.getElementById("details").innerHTML =

      "Pair: " + pair +

      "<br>Timeframe: " + timeframe +

      "<br>EMA 9: " +
      ema9.toFixed(5) +

      "<br>EMA 21: " +
      ema21.toFixed(5) +

      "<br>RSI: " +
      rsi.toFixed(2);

  }


  catch(error){

    document.getElementById("details").innerText =
      "Error: " + error.message;

  }

}

</script>

</body>
</html>
