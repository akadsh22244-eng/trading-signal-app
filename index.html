<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forex & OTC Signal App</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08111f;
  color:white;
}
.header{
  background:#111d31;
  padding:25px 15px;
  text-align:center;
}
.header h1{margin:0;font-size:28px}
.header p{color:#aeb9cc;font-size:16px}

.card{
  margin:20px;
  padding:25px;
  background:#111d31;
  border-radius:25px;
}
label{
  display:block;
  margin:15px 0 8px;
  font-size:17px;
}
select{
  width:100%;
  padding:17px;
  border:0;
  border-radius:15px;
  font-size:17px;
}
button{
  width:100%;
  margin-top:20px;
  padding:18px;
  border:0;
  border-radius:15px;
  background:#2864e8;
  color:white;
  font-size:18px;
  font-weight:bold;
}
button:active{transform:scale(.98)}

.signal{
  margin-top:20px;
  padding:30px 15px;
  text-align:center;
  border-radius:22px;
  background:#073322;
}
.signal h2{margin:0 0 15px}
.signal .value{
  font-size:48px;
  font-weight:bold;
}
.buy{color:#20e477}
.sell{color:#ff5555}
.wait{color:#ffd34d}

.price{
  margin-top:20px;
  background:#18253a;
  padding:20px;
  border-radius:18px;
  text-align:center;
}
.price-number{
  font-size:30px;
  font-weight:bold;
}
.small{
  color:#aeb9cc;
  margin-top:8px;
}
.note{
  margin:20px;
  color:#9eabc0;
  font-size:13px;
  text-align:center;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="header">
  <h1>📊 Forex & OTC Signal App</h1>
  <p>1 Minute • 5 Minute • BUY / SELL</p>
</div>

<div class="card">

<label>Market</label>
<select id="market" onchange="changePairs()">
  <option value="forex">Forex Market</option>
  <option value="otc">OTC Market</option>
</select>

<label>Currency Pair</label>
<select id="pair">
  <option>EUR/USD</option>
  <option>GBP/USD</option>
  <option>USD/JPY</option>
  <option>AUD/USD</option>
  <option>USD/CAD</option>
  <option>USD/CHF</option>
  <option>EUR/JPY</option>
  <option>GBP/JPY</option>
</select>

<label>Timeframe</label>
<select id="timeframe">
  <option value="1">1 Minute</option>
  <option value="5">5 Minutes</option>
</select>

<button onclick="generateSignal()">
  GENERATE SIGNAL
</button>

<div class="price">
  <div>Current Price</div>
  <div id="price" class="price-number">--</div>
  <div id="priceStatus" class="small">
    Waiting for price data...
  </div>
</div>

<div class="signal">
  <h2>Current Signal</h2>
  <div id="signal" class="value wait">WAIT</div>
  <div id="details" class="small">
    Select market and currency pair
  </div>
</div>

</div>

<div class="note">
  ⚠️ This app is for educational purposes only.
  Signals are not guaranteed and should not be treated as financial advice.
</div>

<script>

const forexPairs = [
  "EUR/USD",
  "GBP/USD",
  "USD/JPY",
  "AUD/USD",
  "USD/CAD",
  "USD/CHF",
  "EUR/JPY",
  "GBP/JPY"
];

const otcPairs = [
  "EUR/USD OTC",
  "GBP/USD OTC",
  "USD/JPY OTC",
  "AUD/USD OTC",
  "EUR/JPY OTC",
  "GBP/JPY OTC"
];

function changePairs(){

  const market =
    document.getElementById("market").value;

  const pair =
    document.getElementById("pair");

  pair.innerHTML="";

  const list =
    market==="forex" ? forexPairs : otcPairs;

  list.forEach(function(item){

    const option =
      document.createElement("option");

    option.textContent=item;
    option.value=item;

    pair.appendChild(option);

  });

  document.getElementById("price").textContent="--";

  document.getElementById("priceStatus").textContent =
    "Price data waiting...";
}

function generateSignal(){

  const market =
    document.getElementById("market").value;

  const pair =
    document.getElementById("pair").value;

  const timeframe =
    document.getElementById("timeframe").value;

  const signal =
    document.getElementById("signal");

  const details =
    document.getElementById("details");

  /*
   Temporary demo calculation.
   Real live-price analysis will be connected
   to a market-data API later.
  */

  const random =
    Math.random();

  signal.className="value";

  if(random > 0.66){

    signal.textContent="BUY";
    signal.classList.add("buy");

  }
  else if(random < 0.33){

    signal.textContent="SELL";
    signal.classList.add("sell");

  }
  else{

    signal.textContent="WAIT";
    signal.classList.add("wait");

  }

  details.textContent =
    market.toUpperCase() +
    " • " +
    pair +
    " • " +
    timeframe +
    " Minute";

}

</script>

</body>
</html>
