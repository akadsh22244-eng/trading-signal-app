
    signal.textContent="BUY";
    signal.classList.add("buy");

  }
  else if(random < 0.33){

    signal.textContent="SELL";
    signal.classList.add("sell");

  }
  else{

    signal.textContent="WAIT";
    signal.classList.add("wait");

  }

  details.textContent =
    market.toUpperCase() +
    " • " +
    pair +
    " • " +
    timeframe +
    " Minute";

}

</script>

</body>
</html>
